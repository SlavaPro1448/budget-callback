<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Grosch — возврат в приложение</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 48px 24px; text-align: center; color: #222; background: #f7f7f8; }
  a.button { display: inline-block; margin-top: 20px; padding: 14px 22px; border-radius: 12px; background: #1a9c6b; color: #fff; text-decoration: none; font-weight: 600; }
  p { color: #666; max-width: 32em; margin: 12px auto; }
</style>
</head>
<body>
<h2>Возвращаемся в «Grosch»…</h2>
<p id="hint">Если приложение не открылось само, нажми кнопку.</p>
<a id="open" class="button" href="#">Открыть «Grosch»</a>
<script>
  // Банк вернул браузер сюда после подтверждения доступа. Страница ничего не хранит и никуда не отправляет:
  // просто передаёт параметры (code, state, error) в приложение по его схеме gpbudget://.
  var target = "gpbudget://enable-banking" + (location.search || "");
  document.getElementById("open").setAttribute("href", target);
  if (location.search) { location.replace(target); }
  else { document.getElementById("hint").textContent = "На этой странице нечего делать: она нужна только для возврата из банка в приложение."; }
</script>
</body>
</html>
